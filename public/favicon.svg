<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Dark Backing -->
  <rect width="64" height="64" rx="16" fill="#0B1127"/>
  <rect width="64" height="64" rx="16" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Orbital Ring 1 -->
  <ellipse cx="32" cy="32" rx="22" ry="9" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="3 2" transform="rotate(-30 32 32)" opacity="0.85"/>

  <!-- Orbital Ring 2 -->
  <ellipse cx="32" cy="32" rx="22" ry="9" stroke="url(#orbitGrad)" stroke-width="2.5" transform="rotate(30 32 32)" opacity="0.85"/>

  <!-- Core Nucleus with glow -->
  <circle cx="32" cy="32" r="7" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="3" fill="#FFFFFF"/>

  <!-- Orbital Satellites / Nodes -->
  <circle cx="48" cy="23" r="2.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="16" cy="41" r="2.5" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="20" cy="20" r="2" fill="#06b6d4"/>
</svg>
